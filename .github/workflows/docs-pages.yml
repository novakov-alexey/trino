name: Publish docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point canonical URLs at GitHub Pages
        run: |
          sed -i "s|^html_baseurl = .*|html_baseurl = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/'|" \
            docs/src/main/sphinx/conf.py

      - name: Build docs
        run: docs/build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/target/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
